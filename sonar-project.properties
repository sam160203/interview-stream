# ===========================================================
# FILE: sonar-project.properties
# This file is read by SonarQube scanner running in Jenkins.
# Jenkins does NOT override these settings.
# ===========================================================

# Unique Project Key in SonarQube
sonar.projectKey=interview-stream-app

# Project Name (optional)
sonar.projectName=Interview Stream Platform

# Source code directory
# If your project has 'src/' folder → use that
# If your project code is in root → use '.'
sonar.sources=.

# Encoding
sonar.sourceEncoding=UTF-8

# Programming language (for JS/TS projects)
sonar.language=js

# Exclude build artefacts
sonar.exclusions=**/.next/**, **/node_modules/**

# Tests (optional)
# sonar.tests=tests
# sonar.test.inclusions=**/*.test.js, **/*.spec.js

# Coverage report (optional — only if Jest coverage used)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

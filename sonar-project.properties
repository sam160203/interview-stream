===========================================================

FILE: sonar-project.properties

Yeh file SonarQube Scanner ko batati hai ki project ko kaise scan karna hai.

Hum yahan 'host' aur 'login' nahi daalte, woh Jenkins runtime par inject karta hai.

===========================================================

Unique Project Key in SonarQube (Jenkinsfile mein use hota hai)

sonar.projectKey=interview-stream-app

Project Name (optional)

sonar.projectName=Interview Stream Platform

Source code directory (code 'src' folder mein hai)

sonar.sources=src

Encoding

sonar.sourceEncoding=UTF-8

Programming language (for JS/TS projects)

sonar.language=js

Exclude build artefacts (Bina matlab ke files ko scan se hatana)

sonar.exclusions=/.next/, /node_modules/, **/*.min.js

Tests (optional)

Aap testing use kar rahe hain, isliye yeh lines open rakhi jaa sakti hain

sonar.tests=tests

sonar.test.inclusions=**/.test.js, **/.spec.js

Coverage report (optional — sirf agar aap coverage report generate karte hain)

sonar.javascript.lcov.reportPaths=coverage/lcov.info
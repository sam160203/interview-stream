# ==================================================
# PART 1: SECRETS DEFINITION
# Yahan hum saari Base64 encoded keys define karte hain.
# ==================================================
apiVersion: v1
kind: Secret
metadata:
  name: interview-stream-secrets # Is Secret ka naam deployment mein refer hoga
type: Opaque
data:
  # Aapki Base64 Encoded Keys Yahan Aayengi (Purani Encoded Strings use ki gayi hain)
  # NOTE: In strings ko aapki original keys ke encoded values se replace zaroor karein.
  CLERK_SECRET_KEY: c2tfdGVzdF8zazZHd1ZOeFZvb2RBa2lBc1AxcXFFZFdKeUtOYmFRSGdPRzdBUnBQM0E=
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: cGtfdGVzdF8uLi4=
  STREAM_SECRET_KEY: eW5wZWRmMy4uLg==
  NEXT_PUBLIC_STREAM_API_KEY: ZGN3eDVtcS4uLg==
  NEXT_PUBLIC_CONVEX_URL: aHR0cHM6Ly8uLi4=

--- # Kubernetes mein objects ko alag karne ke liye yeh separator zaroori hai

# ==================================================
# PART 2: DEPLOYMENT DEFINITION
# Yeh Secret ko use karke Containers ko chalaata hai.
# ==================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-stream-deployment # Jenkins is naam ko rollout status ke liye use karega
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-stream
  template:
    metadata:
      labels:
        app: interview-stream
    spec:
      containers:
      - name: interview-stream-app
        # 🛑 JENKINS YAHAN BADLAV KAREGA 🛑
        image: PLACEHOLDER_IMAGE_TAG 
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        # 🔑 Secrets ko Secret Object se refer karna
        env:
        # CLERK SECRET KEY
        - name: CLERK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: interview-stream-secrets # Secret object ka naam
              key: CLERK_SECRET_KEY        # Secret object ke andar ki key
        # CLERK PUBLIC KEY
        - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: interview-stream-secrets
              key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        # STREAM SECRET KEY
        - name: STREAM_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: interview-stream-secrets
              key: STREAM_SECRET_KEY
        # STREAM PUBLIC KEY
        - name: NEXT_PUBLIC_STREAM_API_KEY
          valueFrom:
            secretKeyRef:
              name: interview-stream-secrets
              key: NEXT_PUBLIC_STREAM_API_KEY
        # CONVEX URL
        - name: NEXT_PUBLIC_CONVEX_URL
          valueFrom:
            secretKeyRef:
              name: interview-stream-secrets
              key: NEXT_PUBLIC_CONVEX_URL